plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.luneruniverse.minecraft.nbtdatabase'
version = '0.0.1-SNAPSHOT'

java.sourceCompatibility = JavaVersion.VERSION_1_8
java.targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven {
        url = uri('https://jitpack.io')
    }
}

dependencies {
    api libs.sqlite
    api libs.slf4j.api
    api libs.slf4j.simple
    api libs.mega12345mega.nettymux
    api libs.esotericsoftware.kryo
    api libs.mega12345mega.simplecli
    api libs.google.gson
    api libs.steos.jnafilechooser
    api libs.querz.nbt
    api libs.owasp.encoder
    api libs.apache.httpclient
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
